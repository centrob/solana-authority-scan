[package]
name = "solana-authority-scan"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Who can change a Solana program, and how fast: upgrade authority, Squads v4 multisig settings and proposals, from public chain data. Read-only; holds no keys"
license = "Apache-2.0"
repository = "https://github.com/centrob/solana-authority-scan"
readme = "README.md"
keywords = ["solana", "security", "multisig", "squads", "upgrade-authority"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
include = [
  "/src/**/*.rs",
  "/docs/*.md",
  "/tests/fixtures/rpc/*.json",
  # The no-sending check, so the published package carries it and it runs from there.
  "/tests/no_sending.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
]

[[bin]]
name = "solana-authority-scan"
path = "src/bin/solana-authority-scan/main.rs"
required-features = ["http"]

[features]
default = ["http"]
# The blocking HTTPS transport (`read::HttpRpc`) and the binary. Without it the crate
# has no HTTP or TLS dependency; a caller with its own transport implements
# `read::Rpc` and leaves it off.
http = ["dep:ureq"]

# Every dependency is pinned exactly, with default features off unless a feature is
# needed. `deny.toml` bans the signing, keypair and sending crates.
[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
curve25519-dalek = { version = "=5.0.0", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "=1.0.152", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
